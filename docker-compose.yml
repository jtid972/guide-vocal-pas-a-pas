# Guide vocal pas à pas — lancement local (Linux, Windows avec Docker Desktop, macOS avec Docker Desktop)
#   docker compose up -d --build      puis ouvrir http://localhost:8080
services:
  guide-vocal-pas-a-pas:
    build: .
    image: guide-vocal-pas-a-pas:local
    ports:
      - "127.0.0.1:8080:8000"   # remplacer par "8080:8000" pour l'ouvrir au réseau local
    volumes:
      - gvap-data:/data          # travaux en cours (résultats téléchargeables)
      - gvap-voix:/opt/voices    # voix Piper téléchargées (conservées entre redémarrages)
    environment:
      PIPER_VOICE_FEMME: fr_FR-siwis-medium
      PIPER_VOICE_HOMME: fr_FR-tom-medium
      MAX_CARACTERES: "8000"
      # APP_PASSWORD: "change-moi"   # à activer si l'outil est ouvert au réseau
    restart: unless-stopped

volumes:
  gvap-data:
  gvap-voix:
